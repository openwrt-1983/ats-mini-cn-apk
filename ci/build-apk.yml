# 这是 .github/workflows/build-apk.yml 的副本。
#
# 为什么在这里：GitHub 规定，创建或修改 .github/workflows/ 下的文件必须用带
# `workflow` scope 的 token。当前使用的 token 只有 `repo` scope，推 workflow 会被
# 拒绝（remote rejected: refusing to allow a Personal Access Token to create or
# update workflow without `workflow` scope），走 API 写入则直接返回 404。
#
# 启用办法（任选其一）：
#   1. 网页上打开本文件 → 复制内容 → 在仓库根目录新建
#      .github/workflows/build-apk.yml → 粘贴提交（网页操作用你自己的登录会话，不需要 token scope）
#   2. 换一个带 workflow scope 的 token，然后：
#      mkdir -p .github/workflows && cp ci/build-apk.yml .github/workflows/ \
#        && git add .github/workflows/build-apk.yml && git commit -m 'ci: enable APK build'
#
# 启用后，push 到 main 或手动 workflow_dispatch 都会出 debug APK，
# 产物在 Actions 页面 Artifacts 里下载。

name: Build APK

# 推到 main 或手动触发即可出包，产物在 Actions 页面的 Artifacts 里下载。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 安装依赖
        # 必须带 --legacy-peer-deps：lockfile 里的串口插件与 Capacitor 7 的 peer 声明有冲突
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 同步 web 资源到 Android 工程
        # 刻意不用 npx cap copy / sync：README 明确警告那两个命令会覆盖
        # android/capacitor.settings.gradle，导致插件版本错配、启动白屏。
        # 这里只做 dist -> assets/public 的纯文件复制。
        run: |
          mkdir -p android/app/src/main/assets/public
          rsync -a --delete dist/ android/app/src/main/assets/public/

      - name: 切换 Gradle 下载源
        # 仓库里配的是腾讯云镜像，在国内很快，但从 GitHub 的机器访问容易超时；
        # 在 CI 里换成官方源，本地配置保持不动。
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ats-mini-cn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
