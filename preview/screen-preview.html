<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>ATS Mini 屏幕镜像预览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f5f7;color:#1f2328;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:28px}
header{max-width:1180px;margin:0 auto 22px}
h1{font-size:20px;font-weight:650;letter-spacing:.2px}
.sub{color:#57606a;font-size:13px;margin-top:6px;line-height:1.6}
#grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:12px 12px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:13px;font-weight:600;margin-bottom:9px;color:#24292f}
.screen{width:100%;height:auto;display:block;border-radius:5px;border:1px solid #2a2f36;background:#0b0e12;image-rendering:pixelated}
.card p{font-size:11.5px;color:#6a737d;margin-top:8px;line-height:1.5}
</style></head>
<body>
<header>
  <h1>ATS Mini 屏幕镜像 · 渲染预览</h1>
  <div class="sub">320×170，与固件 drawLayoutDefault / drawLayoutSmeter / drawSideBar 同一套几何。以下每一格都是 renderScreen() 的真实输出（2× 缩放）。<br>
  <b>第 1 格</b>按你的真机照片复原（VHF 97.00 FM / RSSI 39 / SNR 18），<b>第 2 格</b>是同一状态下默认布局的样子，两格都能在 App 里实时切换。</div>
</header>
<div id="grid"></div>

  var BANDS = [

    { name: "11M", min: 256e5, max: 261e5 },

    { name: "19M", min: 151e5, max: 159e5 },
    { name: "22M", min: 135e5, max: 139e5 },
    { name: "25M", min: 11e6, max: 13e6 },
    { name: "31M", min: 9e6, max: 11e6 },
    { name: "41M", min: 7e6, max: 9e6 },
    { name: "49M", min: 5e6, max: 7e6 },
    { name: "60M", min: 4e6, max: 51e5 },
    { name: "75M", min: 35e5, max: 4e6 },
    { name: "90M", min: 3e6, max: 35e5 },
    { name: "MW3", min: 17e5, max: 35e5 },
    { name: "MW2", min: 495e3, max: 1701e3 },
    { name: "MW1", min: 15e4, max: 18e5 },
    { name: "160M", min: 18e5, max: 2e6 },
    { name: "80M", min: 35e5, max: 4e6 },
    { name: "40M", min: 7e6, max: 73e5 },
    { name: "30M", min: 1e7, max: 102e5 },
    { name: "20M", min: 14e6, max: 144e5 },
    { name: "17M", min: 18e6, max: 182e5 },
    { name: "15M", min: 21e6, max: 215e5 },
    { name: "12M", min: 248e5, max: 25e6 },
    { name: "10M", min: 28e6, max: 297e5 },
    { name: "CB", min: 25e6, max: 28e6 }
  ];
  function getStrength(rssi, mode) {
    if (mode !== 0) {
      if (rssi <= 1) return 1;
      if (rssi <= 2) return 2;
      if (rssi <= 3) return 3;
      if (rssi <= 4) return 4;
      if (rssi <= 10) return 5;
      if (rssi <= 16) return 6;
      if (rssi <= 22) return 7;
      if (rssi <= 28) return 8;
      if (rssi <= 34) return 9;
      if (rssi <= 44) return 10;
      if (rssi <= 54) return 11;
      if (rssi <= 64) return 12;
      if (rssi <= 74) return 13;
      if (rssi <= 84) return 14;
      if (rssi <= 94) return 15;
      if (rssi <= 95) return 16;
      return 17;
    }
    if (rssi <= 1) return 1;
    if (rssi <= 2) return 7;
    if (rssi <= 8) return 8;
    if (rssi <= 14) return 9;
    if (rssi <= 24) return 10;
    if (rssi <= 34) return 11;
    if (rssi <= 44) return 12;
    if (rssi <= 54) return 13;
    if (rssi <= 64) return 14;
    if (rssi <= 74) return 15;
    if (rssi <= 76) return 16;
    return 17;
  }
  function bandRange(name) {
    return BANDS.find((b) => b.name === name) || BANDS[1];
  }
  var F_SMALL = '16px "DejaVu Sans Mono", "Menlo", "Consolas", monospace';
  var F_LARGE = '24px "DejaVu Sans Mono", "Menlo", "Consolas", monospace';
  var F_BAND = '24px "Helvetica Neue", Arial, sans-serif';
  function px(v) {
    return Math.round(v) + 0.5;
  }
  function line(ctx, x1, y1, x2, y2, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (y1 === y2) {
      ctx.moveTo(x1, px(y1));
      ctx.lineTo(x2, px(y1));
    } else if (x1 === x2) {
      ctx.moveTo(px(x1), y1);
      ctx.lineTo(px(x1), y2);
    } else {
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.stroke();
  }
  function rect(ctx, x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function tri(ctx, x1, y1, x2, y2, x3, y3, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();
    ctx.fill();
  }
  function roundRectPath(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function roundRect(ctx, x, y, w, h, r, stroke, fill) {
    roundRectPath(ctx, x, y, w, h, r);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  function setFont(ctx, font, color, align, baseline) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.textBaseline = baseline || "top";
  }
  var SEG_MAP = {
    "0": "abcdef",
    "1": "bc",
    "2": "abged",
    "3": "abgcd",
    "4": "fgbc",
    "5": "afgcd",
    "6": "afgecd",
    "7": "abc",
    "8": "abcdefg",
    "9": "abcdfg",
    "-": "g",
    " ": ""
  };
  function hseg(ctx, x, y, len, t, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + t / 2, y - t / 2);
    ctx.lineTo(x + len - t / 2, y - t / 2);
    ctx.lineTo(x + len, y);
    ctx.lineTo(x + len - t / 2, y + t / 2);
    ctx.lineTo(x + t / 2, y + t / 2);
    ctx.closePath();
    ctx.fill();
  }
  function vseg(ctx, x, y, len, t, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + t / 2, y + t / 2);
    ctx.lineTo(x + t / 2, y + len - t / 2);
    ctx.lineTo(x, y + len);
    ctx.lineTo(x - t / 2, y + len - t / 2);
    ctx.lineTo(x - t / 2, y + t / 2);
    ctx.closePath();
    ctx.fill();
  }
  function seg7char(ctx, x, y0, ch, w, h, color) {
    const segs = SEG_MAP[ch];
    if (segs === void 0) return;
    const t = Math.round(h * 0.11);
    const gap = 1.5;
    const top = y0 + t / 2;
    const mid = y0 + h / 2;
    const bot = y0 + h - t / 2;
    const left = x + t / 2;
    const right = x + w - t / 2;
    const hlen = w - t;
    const vlen = h / 2 - t / 2 - gap;
    if (segs.includes("a")) hseg(ctx, left, top, hlen, t, color);
    if (segs.includes("g")) hseg(ctx, left, mid, hlen, t, color);
    if (segs.includes("d")) hseg(ctx, left, bot, hlen, t, color);
    if (segs.includes("f")) vseg(ctx, left, top + t / 2 + gap, vlen, t, color);
    if (segs.includes("b")) vseg(ctx, right, top + t / 2 + gap, vlen, t, color);
    if (segs.includes("e")) vseg(ctx, left, mid + gap, vlen, t, color);
    if (segs.includes("c")) vseg(ctx, right, mid + gap, vlen, t, color);
  }
  function drawDigits(ctx, str, xRight, midY, color) {
    const h = 48;
    const DOT_W = 12;
    const DIGIT_W = 32;
    const y0 = midY - h / 2;
    let total = 0;
    for (const c of str) total += c === "." ? DOT_W : DIGIT_W;
    let x = xRight - total;
    for (const c of str) {
      if (c === ".") {
        rect(ctx, x + 2, y0 + h - 7, 6, 6, color);
        x += DOT_W;
      } else {
        seg7char(ctx, x, y0, c, DIGIT_W, h, color);
        x += DIGIT_W;
      }
    }
  }
  function drawSaveIndicator(ctx, th, x, y) {
    rect(ctx, x + 3, y + 2, 3, 5, th.save_icon);
    tri(ctx, x + 1, y + 7, x + 7, y + 7, x + 4, y + 10, th.save_icon);
    line(ctx, x, y + 12, x, y + 13, th.save_icon);
    line(ctx, x, y + 13, x + 8, y + 13, th.save_icon);
    line(ctx, x + 8, y + 13, x + 8, y + 12, th.save_icon);
  }
  function drawBleIndicator(ctx, th, x, y, connected) {
    const c = connected ? th.rf_icon_conn : th.rf_icon;
    line(ctx, x + 3, y + 1, x + 3, y + 13, c);
    line(ctx, x + 3, y + 1, x + 6, y + 4, c);
    line(ctx, x + 6, y + 4, x, y + 10, c);
    line(ctx, x, y + 4, x + 6, y + 10, c);
    line(ctx, x + 6, y + 10, x + 3, y + 13, c);
  }
  function drawWiFiIndicator(ctx, th, x, y, connected) {
    const c = connected ? th.rf_icon_conn : th.rf_icon;
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    const set = [[14, 13], [9, 8], [4, 3]];
    for (const [rx, ry] of set) {
      ctx.beginPath();
      ctx.ellipse(x, y + 15, rx, ry, 0, 240 * Math.PI / 180, 300 * Math.PI / 180);
      ctx.stroke();
    }
  }
  function drawBattery(ctx, th, x, y, volts) {
    roundRect(ctx, x, y + 1, 28, 14, 3, th.batt_border, null);
    line(ctx, x + 29, y + 5, x + 29, y + 10, th.batt_border);
    line(ctx, x + 30, y + 6, x + 30, y + 9, th.batt_border);
    setFont(ctx, F_SMALL, th.batt_voltage, "right", "top");
    if (volts > 4.3) {
      roundRect(ctx, x + 2, y + 3, 24, 10, 2, null, th.batt_charge);
      ctx.fillStyle = th.batt_icon;
      ctx.fillRect(x + 19, y + 7, 10, 2);
      tri(ctx, x + 16, y + 1, x + 13, y + 7, x + 9, y + 8, th.batt_icon);
      tri(ctx, x + 14, y + 7, x + 19, y + 7, x + 12, y + 14, th.batt_icon);
      return false;
    }
    let level = 24;
    let color = th.batt_full;
    const pct = volts;
    if (pct < 3.68) {
      level = 6;
      color = th.batt_low;
    } else if (pct < 3.78) {
      level = 12;
      color = th.batt_full;
    } else if (pct < 3.88) {
      level = 18;
      color = th.batt_full;
    }
    roundRect(ctx, x + 2, y + 3, level, 10, 2, null, color);
    ctx.fillText(volts.toFixed(2) + "V", x - 3, y);
    return true;
  }
  function drawBandAndMode(ctx, th, band, mode, x, y, vfoIdx) {
    setFont(ctx, F_BAND, th.band_text, "center", "top");
    ctx.fillText(band, x, y);
    const bandW = ctx.measureText(band).width;
    setFont(ctx, F_SMALL, th.mode_text, "left", "top");
    ctx.fillText(mode, x + bandW / 2 + 12, y + 8);
    const modeW = ctx.measureText(mode).width;
    roundRect(ctx, x + bandW / 2 + 8, y + 7, modeW + 8, 17, 4, th.mode_border, null);
    const vfoX = x + bandW / 2 + modeW + 20;
    roundRect(ctx, vfoX, y + 7, 17, 17, 4, th.mode_border, null);
    setFont(ctx, F_SMALL, th.mode_text, "center", "top");
    ctx.fillText(vfoIdx ? "B" : "A", vfoX + 9, y + 8);
  }
  function drawFrequency(ctx, th, st) {
    const x = LAYOUT.FREQ_X;
    const y = LAYOUT.FREQ_Y;
    const ux = LAYOUT.FUNIT_X;
    const uy = LAYOUT.FUNIT_Y;
    const freq = st.freq;
    if (st.mode === 0) {
      drawDigits(ctx, (freq / 1e6).toFixed(2), x, y, th.freq_text);
      setFont(ctx, F_BAND, th.funit_text, "left", "alphabetic");
      ctx.fillText("MHz", ux, uy + 17);
    } else {
      if (st.mode === 1 || st.mode === 2) {
        drawDigits(ctx, String(Math.floor(freq / 1e3)).padStart(3, " "), x, y, th.freq_text);
        setFont(ctx, F_LARGE, th.freq_text, "left", "middle");
        ctx.fillText("." + String(freq % 1e3).padStart(3, "0"), 4 + x, 17 + y);
      } else {
        drawDigits(ctx, String(Math.floor(freq / 1e3)), x, y, th.freq_text);
        setFont(ctx, F_LARGE, th.freq_text, "left", "middle");
        ctx.fillText(".000", 4 + x, 17 + y);
      }
      setFont(ctx, F_BAND, th.funit_text, "left", "alphabetic");
      ctx.fillText("kHz", ux, uy + 19);
    }
  }

    roundRect(ctx, 1 + x, 1 + y, 86, 110, 4, th.box_border, th.box_bg);
    const rows = [
      ["\u6B65\u8FDB:", st.stepDesc || "5k"],
      ["\u5E26\u5BBD:", st.bwDesc || "3.0k"],

    else if (st.standbyTimer > 0) rows.push(["\u5F85\u673A:", String(st.standbyTimer)]);

    rows.forEach((row, i) => {

  function drawMenuPanel(ctx, th, st, title, items, idx) {

    for (let i = -2; i <= 2; i++) {
      if (count < 5 && (idx + i < 0 || idx + i >= count)) continue;
      const item = items[((idx + i) % count + count) % count];
      const sel = i === 0;
      setFont(ctx, F_SMALL, sel ? th.menu_hl_text : th.menu_item, "center", "middle");

    bw: "\u5E26\u5BBD",

    seek: "\u641C\u53F0",
    scan: "\u626B\u9891",
    vfo: "VFO A/B",
    softmute: "\u8F6F\u9759\u97F3",
    brt: "\u4EAE\u5EA6",
    datetime: "\u65E5\u671F\u65F6\u95F4",
    utcoffset: "UTC \u65F6\u533A",
    sleep: "\u4F11\u7720\u5B9A\u65F6",
    sleepmode: "\u4F11\u7720\u65B9\u5F0F",
    offtimer: "\u5173\u673A\u5B9A\u65F6",
    stbytimer: "\u5B9A\u65F6\u5F85\u673A",

  function buildCard({ title, note, st }) {
    const wrap = document.createElement("section");
    wrap.className = "card";
    const h = document.createElement("h2");
    h.textContent = title;
    wrap.appendChild(h);
    const cv = document.createElement("canvas");
    cv.width = 320 * 2;
    cv.height = 170 * 2;
    cv.className = "screen";
    const ctx = cv.getContext("2d");
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    renderScreen(ctx, st);
    wrap.appendChild(cv);
    const p = document.createElement("p");
    p.textContent = note;
    wrap.appendChild(p);
    return wrap;
  }
  var root = document.getElementById("grid");
  CASES.forEach((c) => root.appendChild(buildCard(c)));
